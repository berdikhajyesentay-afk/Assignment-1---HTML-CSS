<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task 3 - Reserve a table</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/task3.css">
</head>
<body>
    <nav class="top-nav py-2">
        <div class="container d-flex flex-wrap gap-2">
            <a href="index.html">Assignment 4</a>
            <a href="task1.html">Task 1</a>
            <a href="task2.html">Task 2</a>
            <a href="task3.html" class="active" aria-current="page">Task 3</a>
        </div>
    </nav>

    <main class="container py-4 py-md-5">
        <div class="row justify-content-center">
            <div class="col-12 col-md-10 col-lg-8 col-xl-7">
                <div class="form-card">
                    <div class="form-card__head">
                        <h1>Reserve a table</h1>
                    </div>

                    <form class="form-card__body" action="#" method="post">
                        <div class="row g-3">
                            <div class="col-12">
                                <label for="name" class="form-label">Your name</label>
                                <input type="text" class="form-control" id="name" name="name" autocomplete="name" required>
                            </div>

                            <div class="col-12 col-sm-6">
                                <label for="email" class="form-label">Email</label>
                                <input type="email" class="form-control" id="email" name="email" autocomplete="email" required>
                            </div>
                            <div class="col-12 col-sm-6">
                                <label for="phone" class="form-label">Phone</label>
                                <input type="tel" class="form-control" id="phone" name="phone" autocomplete="tel" required>
                            </div>

                            <div class="col-6">
                                <label for="guests" class="form-label">Guests</label>
                                <input type="number" class="form-control" id="guests" name="guests" min="1" max="12" value="2" required>
                            </div>
                            <div class="col-6">
                                <label for="date" class="form-label">Date</label>
                                <input type="date" class="form-control" id="date" name="date" required>
                            </div>

                            <div class="col-12 col-sm-6">
                                <fieldset>
                                    <legend class="form-label">Seating</legend>
                                    <div class="form-check form-check-inline">
                                        <input class="form-check-input" type="radio" name="seating" id="inside" value="inside" required>
                                        <label class="form-check-label" for="inside">Inside</label>
                                    </div>
                                    <div class="form-check form-check-inline">
                                        <input class="form-check-input" type="radio" name="seating" id="terrace" value="terrace">
                                        <label class="form-check-label" for="terrace">Terrace</label>
                                    </div>
                                </fieldset>
                            </div>
                            <div class="col-12 col-sm-6">
                                <label for="meal" class="form-label">Meal</label>
                                <select class="form-select" id="meal" name="meal">
                                    <option value="lunch">Lunch</option>
                                    <option value="dinner">Dinner</option>
                                </select>
                            </div>

                            <div class="col-12">
                                <label for="comments" class="form-label">Comments</label>
                                <textarea class="form-control" id="comments" name="comments" rows="3"></textarea>
                            </div>

                            <div class="col-12">
                                <div class="form-check">
                                    <input class="form-check-input" type="checkbox" id="terms" name="terms" required>
                                    <label class="form-check-label" for="terms">I agree to the terms</label>
                                </div>
                            </div>

                            <div class="col-12 d-grid d-sm-flex justify-content-sm-end">
                                <button type="submit" class="btn btn-amber">Reserve</button>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </main>
</body>
</html>
