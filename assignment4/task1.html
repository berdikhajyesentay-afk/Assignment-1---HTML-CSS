<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task 1 - Book a train ticket</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/task1.css">
</head>
<body>
    <nav class="top-nav py-2">
        <div class="container d-flex flex-wrap gap-2">
            <a href="index.html">Assignment 4</a>
            <a href="task1.html" class="active" aria-current="page">Task 1</a>
            <a href="task2.html">Task 2</a>
            <a href="task3.html">Task 3</a>
        </div>
    </nav>

    <main class="container py-4 py-md-5">
        <div class="row justify-content-center">
            <div class="col-12 col-lg-10 col-xl-9">
                <div class="form-card">
                    <div class="form-card__head">
                        <h1>Book a train ticket</h1>
                    </div>

                    <form class="form-card__body">
                        <fieldset class="mb-3">
                            <legend class="visually-hidden">Trip type</legend>
                            <div class="btn-group trip-toggle">
                                <input type="radio" class="btn-check" name="trip" id="oneWay" value="one-way" checked>
                                <label class="btn" for="oneWay">One way</label>
                                <input type="radio" class="btn-check" name="trip" id="roundTrip" value="round-trip">
                                <label class="btn" for="roundTrip">Round trip</label>
                            </div>
                        </fieldset>

                        <div class="row g-3">
                            <div class="col-12 col-md-6">
                                <div class="form-floating">
                                    <input type="text" class="form-control" id="from" name="from" placeholder="Astana" required>
                                    <label for="from">From</label>
                                </div>
                            </div>
                            <div class="col-12 col-md-6">
                                <div class="form-floating">
                                    <input type="text" class="form-control" id="to" name="to" placeholder="Almaty" required>
                                    <label for="to">To</label>
                                </div>
                            </div>

                            <div class="col-12 col-md-4">
                                <label for="departure" class="form-label">Departure</label>
                                <input type="date" class="form-control" id="departure" name="departure" required>
                            </div>
                            <div class="col-12 col-md-4">
                                <label for="return" class="form-label">Return</label>
                                <input type="date" class="form-control" id="return" name="return">
                            </div>
                            <div class="col-12 col-md-4">
                                <label for="passengers" class="form-label">Passengers</label>
                                <select class="form-select" id="passengers" name="passengers">
                                    <option value="1">1 adult</option>
                                    <option value="2">2 adults</option>
                                    <option value="3">3 adults</option>
                                    <option value="4">4 adults</option>
                                    <option value="5">5 adults</option>
                                    <option value="6">6 adults</option>
                                </select>
                            </div>

                            <div class="col-12">
                                <fieldset>
                                    <legend class="form-label">Carriage class</legend>
                                    <div class="form-check form-check-inline">
                                        <input class="form-check-input" type="radio" name="carriage" id="seat" value="seat" required>
                                        <label class="form-check-label" for="seat">Seat</label>
                                    </div>
                                    <div class="form-check form-check-inline">
                                        <input class="form-check-input" type="radio" name="carriage" id="coupe" value="coupe" checked>
                                        <label class="form-check-label" for="coupe">Coupé</label>
                                    </div>
                                    <div class="form-check form-check-inline">
                                        <input class="form-check-input" type="radio" name="carriage" id="sleeper" value="sleeper">
                                        <label class="form-check-label" for="sleeper">Sleeper</label>
                                    </div>
                                </fieldset>
                            </div>

                            <div class="col-12 col-md-6">
                                <label for="phone" class="form-label">Phone</label>
                                <div class="input-group">
                                    <span class="input-group-text">+7</span>
                                    <input type="tel" class="form-control" id="phone" name="phone" placeholder="701 234 56 78" autocomplete="tel" required>
                                </div>
                            </div>
                            <div class="col-12 col-md-6">
                                <label for="email" class="form-label">Email</label>
                                <input type="email" class="form-control" id="email" name="email" placeholder="name@example.com" autocomplete="email" required>
                            </div>

                            <div class="col-12">
                                <div class="form-check form-switch">
                                    <input class="form-check-input" type="checkbox" role="switch" id="sms" name="sms">
                                    <label class="form-check-label" for="sms">Also send the ticket by SMS</label>
                                </div>
                                <div class="form-check">
                                    <input class="form-check-input" type="checkbox" id="agree" name="agree" required>
                                    <label class="form-check-label" for="agree">I agree with the carriage rules</label>
                                </div>
                            </div>

                            <div class="col-12 d-flex flex-column-reverse flex-md-row justify-content-md-end gap-2 mt-2">
                                <button type="reset" class="btn btn-clear">Clear</button>
                                <button type="submit" class="btn btn-amber">Find trains</button>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </main>
</body>
</html>
